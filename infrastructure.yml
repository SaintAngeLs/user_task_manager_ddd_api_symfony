name: task-manager

services:
  postgres:
    image: postgres:16-alpine
    container_name: task_manager_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
      POSTGRES_USER: ${POSTGRES_USER:-task_manager_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-task_manager_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-task_manager_user} -d ${POSTGRES_DB:-task_manager}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - task_manager_net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: task_manager_pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@taskmanager.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-18080}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    networks:
      - task_manager_net

  app-dev:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: task_manager_app_dev
    restart: unless-stopped
    profiles: ["dev"]
    working_dir: /var/www/app
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "postgresql://${POSTGRES_USER:-task_manager_user}:${POSTGRES_PASSWORD:-task_manager_password}@postgres:5432/${POSTGRES_DB:-task_manager}?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      PHP_IDE_CONFIG: "serverName=task-manager"
    ports:
      - "${APP_PORT_DEV:-19000}:9000"
    volumes:
      - ./TaskManager:/var/www/app
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - app_var:/var/www/app/var
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task_manager_net

  nginx-dev:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: task_manager_nginx_dev
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "${NGINX_PORT_DEV:-18081}:80"
    depends_on:
      - app-dev
    volumes:
      - ./TaskManager:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - task_manager_net

  app-prod:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    container_name: task_manager_app_prod
    restart: unless-stopped
    profiles: ["prod"]
    working_dir: /var/www/app
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-task_manager_user}:${POSTGRES_PASSWORD:-task_manager_password}@postgres:5432/${POSTGRES_DB:-task_manager}?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
    ports:
      - "${APP_PORT_PROD:-19001}:9000"
    volumes:
      - app_var_prod:/var/www/app/var
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task_manager_net

  nginx-prod:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: task_manager_nginx_prod
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "${NGINX_PORT_PROD:-18082}:80"
    depends_on:
      - app-prod
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./TaskManager/public:/var/www/app/public:ro
    networks:
      - task_manager_net

volumes:
  postgres_data:
  pgadmin_data:
  app_var:
  app_var_prod:

networks:
  task_manager_net:
    driver: bridge
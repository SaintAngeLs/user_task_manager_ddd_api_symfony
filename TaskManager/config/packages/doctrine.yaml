doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Set the server version in DATABASE_URL when using MySQL/PostgreSQL.
        # Example:
        # DATABASE_URL="mysql://app:app@127.0.0.1:3306/task_manager?serverVersion=8.0.37"
        # DATABASE_URL="postgresql://app:app@127.0.0.1:5432/task_manager?serverVersion=16&charset=utf8"
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false

        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity

        mappings:
            Task:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/Task'
                prefix: 'App\Infrastructure\Persistence\Doctrine\Task'
                alias: Task

            User:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/User'
                prefix: 'App\Infrastructure\Persistence\Doctrine\User'
                alias: User

            EventStore:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Infrastructure/Persistence/Doctrine/EventStore'
                prefix: 'App\Infrastructure\Persistence\Doctrine\EventStore'
                alias: EventStore

        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
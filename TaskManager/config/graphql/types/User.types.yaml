UserType:
    type: object
    config:
        fields:
            id:
                type: "String!"
            name:
                type: "String!"
            username:
                type: "String!"
            email:
                type: "String!"
            isAdmin:
                type: "Boolean!"

ImportUsersPayload:
    type: object
    config:
        fields:
            success:
                type: "Boolean!"
            importedCount:
                type: "Int!"
            users:
                type: "[UserType!]!"

LoginPayload:
    type: object
    config:
        fields:
            token:
                type: "String!"
            user:
                type: "UserType!"